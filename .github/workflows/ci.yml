name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Committed evidence digests hash CPython 3.10 bytecode (opulse.atoms.library.atoms_digest),
        # so the evidence and export checks only reproduce on Python 3.10.
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The page scripts under docs/assets are tested with Node.js.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Opulse reads worlds, declarations and site data from the repository, so it is
      # installed in editable mode from the checkout, never as a plain wheel.
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev,site]'
      - name: Build the site with strict checks
        run: python -m mkdocs build --strict -f mkdocs.yml -d "$RUNNER_TEMP/site"
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
